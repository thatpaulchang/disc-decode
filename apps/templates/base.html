<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DISC Questionnaire{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    fieldset { margin-bottom: 1rem; padding: 0.5rem 0.75rem; }
    legend { padding: 0 0.25rem; }
    label {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.4rem 0.5rem; min-height: 44px; box-sizing: border-box;
    }
    input:focus, button:focus, a:focus { outline: 3px solid #1a5fb4; outline-offset: 2px; }
    button, a.button { min-height: 44px; padding: 0.5rem 1.5rem; font-size: 1rem; box-sizing: border-box; }
    a.button { display: inline-flex; align-items: center; text-decoration: none; }
    input[type="text"] {
      display: block; width: 100%; min-height: 44px; font-size: 1rem;
      padding: 0.5rem; box-sizing: border-box; margin: 0.5rem 0;
    }
    .disclaimer { font-size: 0.875rem; color: #444; border-top: 1px solid #ccc; margin-top: 2rem; padding-top: 1rem; }

    @media (max-height: 700px) {
      body { margin: 0.5rem auto; }
      h1 { font-size: 1.15rem; margin: 0.5rem 0; }
      p { margin: 0.5rem 0; }
    }
  </style>
</head>
<body>
  {% block content %}{% endblock %}
</body>
</html>
